name: CI
on:
  push:
    branches:
      - master
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Run Biome
        run: npm run lint

      - name: Run Tests
        run: npm test
